<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Agenda (Online)</title>
    
    <!-- 1. Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- 3. Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 4. Supabase Client (Stable UNPKG link) -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        
        body { font-family: 'Cairo', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); } 20%, 40%, 60%, 80% { transform: translateX(4px); } }
        .animate-shake { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ---------------------------------------------------------
        // بيانات مشروع SUPABASE
        // ---------------------------------------------------------
        const SUPABASE_URL = 'https://aawyndbhkgiombfqinyf.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhd3luZGJoa2dpb21iZnFpbnlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxNjEwODYsImV4cCI6MjA4NTczNzA4Nn0.up0E5V0kIsmCduvoGlYB9ntcg7Vdgu6TyfrumKo8Pe4';
        // ---------------------------------------------------------

        // --- القائمة المنسدلة للكورسات ---
        const COURSE_OPTIONS = [
            "Network", "Front-End", "Back-End", "Problem Solving", "Flutter", "Power", 
            "Cyber Security", "HR", "PR", "Marketing", "Robotics", "Embedded System", 
            "Multi Media", "Organization & Logistics", "English", "Photography", 
            "Video Editing", "Scientific Research"
        ];

        // --- Icons ---
        const Icon = ({ path, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {path}
            </svg>
        );

        const Icons = {
            BookOpen: (props) => <Icon {...props} path={<><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>} />,
            Plus: (props) => <Icon {...props} path={<><path d="M5 12h14"/><path d="M12 5v14"/></>} />,
            Calendar: (props) => <Icon {...props} path={<><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>} />,
            Clock: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>} />,
            Trash2: (props) => <Icon {...props} path={<><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></>} />,
            ArrowRight: (props) => <Icon {...props} path={<><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></>} />,
            AlertCircle: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>} />,
            CheckCircle2: (props) => <Icon {...props} path={<><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></>} />,
            ChevronLeft: (props) => <Icon {...props} path={<path d="m15 18-6-6 6-6"/>} />,
            ChevronRight: (props) => <Icon {...props} path={<path d="m9 18 6-6-6-6"/>} />,
            List: (props) => <Icon {...props} path={<><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></>} />,
            LayoutGrid: (props) => <Icon {...props} path={<><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></>} />,
            Lock: (props) => <Icon {...props} path={<><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>} />,
            XCircle: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></>} />,
            Database: (props) => <Icon {...props} path={<><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></>} />,
            Refresh: (props) => <Icon {...props} path={<><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></>} />,
            Settings: (props) => <Icon {...props} path={<><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></>} />,
            X: (props) => <Icon {...props} path={<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>} />
        };

        function SetupScreen() {
            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="bg-white p-8 rounded-2xl shadow-xl max-w-lg w-full text-center border border-gray-200">
                        <h2 className="text-2xl font-bold text-gray-800 mb-3">Supabase Setup Required</h2>
                    </div>
                </div>
            );
        }

        function App() {
            const [supabaseClient, setSupabaseClient] = useState(null);
            const [items, setItems] = useState([]);
            const [viewMode, setViewMode] = useState('list');
            const [currentMonth, setCurrentMonth] = useState(new Date());
            const [isLoading, setIsLoading] = useState(true);
            const [filterDate, setFilterDate] = useState(null); // New state for filtering

            // Form State
            const [courseName, setCourseName] = useState('');
            const [lessonName, setLessonName] = useState('');
            const [date, setDate] = useState(() => {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            });
            const [time, setTime] = useState('09:00');
            const [duration, setDuration] = useState(60);
            
            // Security State
            const [accessCode, setAccessCode] = useState('');
            const SECRET_ADD_CODE = "ET5#2026";
            const SECRET_DELETE_CODE = "2026#ET5";
            
            const [notification, setNotification] = useState(null);

            // --- Initialize Supabase Safely ---
            useEffect(() => {
                if (window.supabase && window.supabase.createClient) {
                    try {
                        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                        setSupabaseClient(client);
                    } catch (error) {
                        console.error("Failed to init Supabase:", error);
                        setNotification({ type: 'error', message: 'Config Error' });
                    }
                } else {
                    console.error("Supabase library not loaded yet.");
                }
            }, []);

            // --- Fetch Data ---
            const fetchItems = async () => {
                if (!supabaseClient) return;
                
                setIsLoading(true);
                const { data, error } = await supabaseClient
                    .from('agenda_items')
                    .select('*')
                    .order('start_time', { ascending: true });

                if (error) {
                    console.error('Error fetching:', error);
                    setNotification({ type: 'error', message: 'Connection Error' });
                } else {
                    // Map DB columns to App state structure
                    const mappedData = data.map(item => ({
                        id: item.id,
                        course: item.course,
                        lesson: item.lesson,
                        start: item.start_time,
                        end: item.end_time,
                        duration: item.duration
                    }));
                    setItems(mappedData);
                }
                setIsLoading(false);
            };

            // --- Load Data & Sync & Subscription ---
            useEffect(() => {
                if (supabaseClient) {
                    fetchItems();
                    const channel = supabaseClient
                        .channel('agenda_changes')
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'agenda_items' }, () => {
                            fetchItems();
                        })
                        .subscribe();

                    return () => {
                        supabaseClient.removeChannel(channel);
                    };
                }
            }, [supabaseClient]);

            // --- Handlers ---
            const handleAddItem = async (e) => {
                e.preventDefault();
                if (!supabaseClient) return;

                if (accessCode !== SECRET_ADD_CODE) {
                    setNotification({ type: 'error', message: 'كود الإضافة غير صحيح!' });
                    setTimeout(() => setNotification(null), 3000);
                    return;
                }

                if (!courseName || !lessonName) return;

                let proposedStart = new Date(`${date}T${time}`);
                let durationMs = duration * 60 * 1000;
                let proposedEnd = new Date(proposedStart.getTime() + durationMs);

                // Client-side conflict check
                const dayItems = items.filter(item => {
                    const itemDate = new Date(item.start);
                    return itemDate.toDateString() === proposedStart.toDateString();
                });
                dayItems.sort((a, b) => new Date(a.start) - new Date(b.start));

                let isRescheduled = false;
                for (let item of dayItems) {
                    const existingStart = new Date(item.start);
                    const existingEnd = new Date(item.end);
                    if (proposedStart < existingEnd && proposedEnd > existingStart) {
                        proposedStart = existingEnd; 
                        proposedEnd = new Date(proposedStart.getTime() + durationMs);
                        isRescheduled = true;
                    }
                }

                const { error } = await supabaseClient
                    .from('agenda_items')
                    .insert([{ 
                        course: courseName,
                        lesson: lessonName,
                        start_time: proposedStart.toISOString(),
                        end_time: proposedEnd.toISOString(),
                        duration: duration
                    }]);

                if (error) {
                    setNotification({ type: 'error', message: 'فشل الحفظ في قاعدة البيانات' });
                } else {
                    if (isRescheduled) {
                        setNotification({ type: 'warning', message: `تعارض! تم نقل الموعد إلى ${proposedStart.toLocaleTimeString()}.` });
                    } else {
                        setNotification({ type: 'success', message: `تمت الإضافة بنجاح.` });
                    }
                    setCourseName(''); // Clear dropdown to default
                    setLessonName('');
                }
                setTimeout(() => setNotification(null), 5000);
            };

            const deleteItem = async (id) => {
                if (!supabaseClient) return;
                const userCode = prompt("أدخل كود الحماية للحذف:");
                if (userCode !== SECRET_DELETE_CODE) {
                    setNotification({ type: 'error', message: 'كود الحذف غير صحيح!' });
                    setTimeout(() => setNotification(null), 3000);
                    return;
                }
                const { error } = await supabaseClient.from('agenda_items').delete().eq('id', id);
                if (error) {
                    setNotification({ type: 'error', message: 'فشل الحذف.' });
                } else {
                    setNotification({ type: 'success', message: 'تم الحذف بنجاح.' });
                }
                setTimeout(() => setNotification(null), 3000);
            };

            // ... helpers ...
            const formatDate = (dateStr) => {
                const options = { weekday: 'short', month: 'short', day: 'numeric' };
                return new Date(dateStr).toLocaleDateString('ar-EG', options);
            };
            const formatTime = (dateObj) => {
                return new Date(dateObj).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            };
            const getDaysInMonth = (date) => new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
            const getFirstDayOfMonth = (date) => new Date(date.getFullYear(), date.getMonth(), 1).getDay();
            const changeMonth = (offset) => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + offset, 1));

            // Helper to get consistent local date string for comparison
            const getLocalDateString = (dateObj) => {
                const year = dateObj.getFullYear();
                const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                const day = String(dateObj.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            // Updated: Handles both form date update and filtering view
            const handleDateSelect = (selectedDate) => {
                const localDateString = getLocalDateString(selectedDate);
                setDate(localDateString); // Update input field
                setFilterDate(localDateString); // Set filter
                setViewMode('list'); // Switch to list view
            };

            const clearFilter = () => {
                setFilterDate(null);
            };

            // --- Renderers ---
            const renderCalendar = () => {
                const daysInMonth = getDaysInMonth(currentMonth);
                const firstDay = getFirstDayOfMonth(currentMonth);
                const days = [];
                for (let i = 0; i < firstDay; i++) { days.push(<div key={`empty-${i}`} className="h-24 bg-gray-50/50 border border-gray-100"></div>); }
                for (let d = 1; d <= daysInMonth; d++) {
                    const currentDayDate = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), d);
                    const dateStr = currentDayDate.toDateString();
                    const daysEvents = items.filter(item => new Date(item.start).toDateString() === dateStr);
                    const count = daysEvents.length;
                    
                    // --- NEW COLOR LOGIC ---
                    let statusColor = "bg-white"; 
                    let statusBorder = "border-gray-100";
                    let countBadgeColor = "bg-white text-gray-600 border-gray-200";

                    if (count > 0) {
                        if (count === 1) {
                            // LIGHT (Green) -> Only 1 event
                            statusColor = "bg-emerald-50"; 
                            statusBorder = "border-emerald-200";
                            countBadgeColor = "bg-emerald-100 text-emerald-700 border-emerald-200";
                        } else {
                            // Check unique courses
                            const uniqueCourses = new Set(daysEvents.map(e => e.course));
                            if (uniqueCourses.size === 1) {
                                // MEDIUM (Yellow) -> Multiple events, SAME course
                                statusColor = "bg-amber-50"; 
                                statusBorder = "border-amber-200";
                                countBadgeColor = "bg-amber-100 text-amber-700 border-amber-200";
                            } else {
                                // BUSY (Red) -> Multiple events, DIFFERENT courses
                                statusColor = "bg-red-50"; 
                                statusBorder = "border-red-200";
                                countBadgeColor = "bg-red-100 text-red-700 border-red-200";
                            }
                        }
                    }
                    // -----------------------
                    
                    const currentSelectedDate = new Date(date);
                    const isSelected = currentSelectedDate.getDate() === d && 
                                     currentSelectedDate.getMonth() === currentMonth.getMonth() && 
                                     currentSelectedDate.getFullYear() === currentMonth.getFullYear();

                    days.push(
                        <div key={d} onClick={() => handleDateSelect(currentDayDate)} 
                             className={`h-24 p-2 border ${statusBorder} ${statusColor} relative cursor-pointer hover:shadow-lg transition-all rounded-lg flex flex-col ${isSelected ? 'ring-2 ring-indigo-500 ring-offset-2 z-10' : ''}`}>
                            <div className="flex justify-between items-start">
                                <span className={`text-sm font-bold ${isSelected ? 'text-indigo-600' : 'text-gray-700'}`}>{d}</span>
                                {count > 0 && (<span className={`text-[10px] font-bold px-1.5 py-0.5 rounded-full border shadow-sm ${countBadgeColor}`}>{count}</span>)}
                            </div>
                            <div className="mt-1 space-y-1 overflow-y-auto scrollbar-hide flex-grow">
                                {daysEvents.slice(0, 3).map((ev, idx) => (
                                    <div key={idx} className="text-[10px] truncate bg-white/80 px-1.5 py-0.5 rounded text-gray-700 shadow-sm border border-gray-100">
                                        {ev.course}
                                    </div>
                                ))}
                                {count > 3 && <div className="text-[9px] text-gray-400 pl-1">+{count - 3} المزيد</div>}
                            </div>
                        </div>
                    );
                }
                return (
                    <div className="animate-fade-in bg-white rounded-2xl border border-gray-200 p-4 shadow-sm">
                        <div className="flex justify-between items-center mb-6 px-2">
                            <button onClick={() => changeMonth(-1)} className="p-2 hover:bg-gray-100 rounded-full text-gray-500 hover:text-indigo-600 transition-colors"><Icons.ChevronLeft className="w-5 h-5" /></button>
                            <h3 className="text-xl font-bold text-gray-800">{currentMonth.toLocaleDateString('ar-EG', { month: 'long', year: 'numeric' })}</h3>
                            <button onClick={() => changeMonth(1)} className="p-2 hover:bg-gray-100 rounded-full text-gray-500 hover:text-indigo-600 transition-colors"><Icons.ChevronRight className="w-5 h-5" /></button>
                        </div>
                        <div className="grid grid-cols-7 mb-2 text-center text-sm font-semibold text-gray-400">
                            {['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'].map(day => <div key={day} className="uppercase tracking-wide">{day}</div>)}
                        </div>
                        <div className="grid grid-cols-7 gap-2">
                            {days}
                        </div>
                        
                        <div className="flex flex-wrap gap-4 mt-6 justify-center text-xs text-gray-500 font-medium">
                            <div className="flex items-center gap-1.5"><div className="w-3 h-3 bg-emerald-50 border border-emerald-200 rounded-full"></div> محاضرة واحدة (خفيف)</div>
                            <div className="flex items-center gap-1.5"><div className="w-3 h-3 bg-amber-50 border border-amber-200 rounded-full"></div> نفس الكورس (متوسط)</div>
                            <div className="flex items-center gap-1.5"><div className="w-3 h-3 bg-red-50 border border-red-200 rounded-full"></div> كورسات مختلفة (مزدحم)</div>
                        </div>
                    </div>
                );
            };

            // Filter logic for List View
            const displayedItems = filterDate 
                ? items.filter(item => getLocalDateString(new Date(item.start)) === filterDate)
                : items;

            return (
                <div className="min-h-screen bg-gray-50 p-4 md:p-8 font-sans" dir="rtl">
                    <div className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
                        {/* HEADER */}
                        <div className="lg:col-span-12 mb-2">
                            <div className="flex flex-col sm:flex-row justify-between items-center gap-4 bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                                <div>
                                    <h1 className="text-3xl font-extrabold text-gray-900 flex items-center gap-3">
                                        <div className="bg-indigo-100 p-2 rounded-xl text-indigo-500">
                                            <Icons.BookOpen className="w-8 h-8" />
                                        </div>
                                        IEEE ET5 SB Agenda  
                                        <span className="text-xs bg-green-100 text-green-700 px-3 py-1 rounded-full flex items-center gap-1 border border-green-200">
                                            <Icons.Database className="w-3 h-3" /> متصل
                                        </span>
                                    </h1>
                                    <p className="text-gray-500 mt-2 mr-1">
                                        يتم مزامنة الجدول لحظياً مع جميع الأجهزة .
                                    </p>
                                </div>
                                <button onClick={fetchItems} className="text-sm bg-gray-50 hover:bg-gray-100 text-gray-600 px-4 py-2 rounded-xl border border-gray-200 flex items-center gap-2 transition-all">
                                    <Icons.Refresh className={`w-4 h-4 ${isLoading ? 'animate-spin' : ''}`} /> 
                                    {isLoading ? 'جاري التحديث...' : 'تحديث البيانات'}
                                </button>
                            </div>
                        </div>

                        {/* LEFT: ADD FORM */}
                        <div className="lg:col-span-4 space-y-6">
                            <div className="bg-white rounded-3xl shadow-lg p-8 border border-gray-100 sticky top-6">
                                <h2 className="text-xl font-bold mb-6 flex items-center gap-3 text-gray-800 pb-4 border-b border-gray-100">
                                    <span className="bg-indigo-600 text-white p-1.5 rounded-lg"><Icons.Plus className="w-5 h-5" /></span>
                                    إضافة محاضرة جديدة
                                </h2>
                                <form onSubmit={handleAddItem} className="space-y-5">
                                    <div className="space-y-1">
                                        <label className="block text-sm font-semibold text-gray-700">اسم الكورس</label>
                                        <div className="relative">
                                            <div className="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-gray-400">
                                                <Icons.BookOpen className="w-5 h-5" />
                                            </div>
                                            <select 
                                                className="w-full pr-10 pl-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-gray-800 appearance-none cursor-pointer"
                                                value={courseName} 
                                                onChange={(e) => setCourseName(e.target.value)} 
                                                required
                                            >
                                                <option value="" disabled>اختر الكورس...</option>
                                                {COURSE_OPTIONS.map((course, idx) => (
                                                    <option key={idx} value={course}>{course}</option>
                                                ))}
                                            </select>
                                            <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                                <Icons.ChevronLeft className="w-4 h-4 rotate-[-90deg]" />
                                            </div>
                                        </div>
                                    </div>
                                    <div className="space-y-1">
                                        <label className="block text-sm font-semibold text-gray-700">عنوان الدرس</label>
                                        <div className="relative">
                                            <div className="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-gray-400">
                                                <Icons.List className="w-5 h-5" />
                                            </div>
                                            <input type="text" placeholder="مثال: الجبر الخطي" className="w-full pr-10 pl-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-gray-800 placeholder-gray-400" value={lessonName} onChange={(e) => setLessonName(e.target.value)} required />
                                        </div>
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1">
                                            <label className="block text-sm font-semibold text-gray-700">التاريخ</label>
                                            <div className="relative">
                                                <input type="date" className="w-full px-3 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-gray-800 text-sm" value={date} onChange={(e) => setDate(e.target.value)} required />
                                            </div>
                                        </div>
                                        <div className="space-y-1">
                                            <label className="block text-sm font-semibold text-gray-700">الوقت</label>
                                            <div className="relative">
                                                <input type="time" className="w-full px-3 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-gray-800 text-sm" value={time} onChange={(e) => setTime(e.target.value)} required />
                                            </div>
                                        </div>
                                    </div>

                                    <div className="space-y-2">
                                        <div className="flex justify-between items-center">
                                            <label className="block text-sm font-semibold text-gray-700">المدة (دقيقة)</label>
                                            <span className="text-xs font-bold bg-indigo-100 text-indigo-700 px-2 py-1 rounded-lg">{duration} دقيقة</span>
                                        </div>
                                        <input type="range" min="15" max="180" step="15" value={duration} onChange={(e) => setDuration(Number(e.target.value))} className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-indigo-600" />
                                    </div>

                                    <div className="bg-amber-50 p-4 rounded-xl border border-amber-100">
                                        <label className="block text-xs font-bold text-amber-800 mb-2 flex items-center gap-2 uppercase tracking-wider">
                                            <Icons.Lock className="w-4 h-4" /> كود الحماية (مطلوب للإضافة)
                                        </label>
                                        <input type="password" placeholder="أدخل الكود هنا..." className="w-full p-2 bg-white border border-amber-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm text-center tracking-widest" value={accessCode} onChange={(e) => setAccessCode(e.target.value)} />
                                    </div>

                                    <button type="submit" disabled={isLoading} className="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 text-white font-bold py-4 px-6 rounded-xl shadow-lg hover:shadow-xl transform transition-all active:scale-95 flex items-center justify-center gap-2 text-lg">
                                        {isLoading ? <Icons.Refresh className="w-5 h-5 animate-spin" /> : <Icons.Plus className="w-5 h-5" />}
                                        {isLoading ? 'جاري الاتصال...' : 'إضافة للأجندة'}
                                    </button>
                                </form>
                                {notification && (
                                    <div className={`mt-4 p-4 rounded-xl text-sm flex gap-3 items-start animate-fade-in border ${notification.type === 'error' ? 'bg-red-50 text-red-800 border-red-200' : notification.type === 'warning' ? 'bg-amber-50 text-amber-800 border-amber-200' : 'bg-emerald-50 text-emerald-800 border-emerald-200'}`}>
                                        {notification.type === 'error' ? <Icons.XCircle className="w-5 h-5 shrink-0" /> : notification.type === 'warning' ? <Icons.AlertCircle className="w-5 h-5 shrink-0" /> : <Icons.CheckCircle2 className="w-5 h-5 shrink-0" />}
                                        <p className="font-medium">{notification.message}</p>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* RIGHT: AGENDA VIEW */}
                        <div className="lg:col-span-8">
                            <div className="bg-white rounded-3xl shadow-lg border border-gray-100 overflow-hidden min-h-[600px] flex flex-col">
                                <div className="bg-gray-50/50 p-6 border-b border-gray-100 flex justify-between items-center backdrop-blur-sm sticky top-0 z-10">
                                    <div className="flex items-center gap-2">
                                        <div className="flex items-center gap-2 bg-gray-100 p-1 rounded-xl border border-gray-200">
                                            <button onClick={() => setViewMode('list')} className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-bold transition-all ${viewMode === 'list' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500 hover:bg-gray-200'}`}><Icons.List className="w-4 h-4" /> قائمة</button>
                                            <button onClick={() => setViewMode('month')} className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-bold transition-all ${viewMode === 'month' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500 hover:bg-gray-200'}`}><Icons.LayoutGrid className="w-4 h-4" /> تقويم</button>
                                        </div>
                                        {filterDate && (
                                            <button onClick={clearFilter} className="flex items-center gap-1 bg-red-50 hover:bg-red-100 text-red-600 px-3 py-2 rounded-lg text-sm font-bold border border-red-200 transition-colors animate-fade-in">
                                                <Icons.X className="w-4 h-4" />
                                                إلغاء الفلتر
                                            </button>
                                        )}
                                    </div>
                                    <span className="text-xs font-bold text-gray-500 bg-white px-3 py-1.5 rounded-full border border-gray-200 shadow-sm">{displayedItems.length} عنصر</span>
                                </div>
                                <div className="p-6 flex-grow bg-gray-50/30">
                                    {viewMode === 'month' ? renderCalendar() : (
                                        displayedItems.length === 0 ? (
                                            <div className="text-center py-32 opacity-60 flex flex-col items-center">
                                                <div className="bg-gray-100 p-6 rounded-full mb-4">
                                                    <Icons.Clock className="w-12 h-12 text-gray-400" />
                                                </div>
                                                <p className="text-2xl font-bold text-gray-700 mb-2">{isLoading ? 'جاري تحميل البيانات...' : (filterDate ? `لا توجد مواعيد في ${filterDate}` : 'لا توجد مواعيد حالياً')}</p>
                                                <p className="text-gray-500">{filterDate ? 'اختر يوماً آخر أو قم بإلغاء الفلتر.' : 'كن أول من يضيف درساً للأجندة!'}</p>
                                            </div>
                                        ) : (
                                            <div className="space-y-6 animate-fade-in max-w-4xl mx-auto">
                                                {/* Header for Filtered View */}
                                                {filterDate && (
                                                    <div className="bg-indigo-50 border border-indigo-100 p-3 rounded-xl text-indigo-800 text-sm font-bold text-center mb-4">
                                                        عرض المواعيد ليوم: {filterDate}
                                                    </div>
                                                )}

                                                {Object.entries(displayedItems.reduce((acc, item) => {
                                                    const dateKey = new Date(item.start).toDateString();
                                                    if (!acc[dateKey]) acc[dateKey] = [];
                                                    acc[dateKey].push(item);
                                                    return acc;
                                                }, {})).map(([dateKey, daysItems]) => (
                                                    <div key={dateKey} className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                                                        <div className="bg-indigo-50/50 px-6 py-3 border-b border-indigo-50 flex items-center gap-2">
                                                            <Icons.Calendar className="w-4 h-4 text-indigo-500" />
                                                            <h3 className="text-sm font-bold text-indigo-900">{formatDate(daysItems[0].start)}</h3>
                                                        </div>
                                                        <div className="divide-y divide-gray-50">
                                                            {daysItems.map((item) => {
                                                                const startDate = new Date(item.start);
                                                                const endDate = new Date(item.end);
                                                                return (
                                                                    <div key={item.id} className="p-5 hover:bg-gray-50 transition-colors flex flex-col sm:flex-row sm:items-center gap-4 group">
                                                                        <div className="min-w-[100px] text-center sm:text-right border-l-0 sm:border-l-2 border-indigo-100 pl-0 sm:pl-4">
                                                                            <div className="text-lg font-black text-gray-800">{formatTime(startDate)}</div>
                                                                            <div className="text-xs font-semibold text-gray-400 mt-1 bg-gray-100 inline-block px-2 py-0.5 rounded-md">{item.duration} دقيقة</div>
                                                                        </div>
                                                                        <div className="flex-grow">
                                                                            <h4 className="text-lg font-bold text-gray-800 flex items-center gap-2">
                                                                                {item.course}
                                                                            </h4>
                                                                            <p className="text-gray-500 text-sm flex items-center gap-2 mt-1">
                                                                                <span className="w-1.5 h-1.5 bg-indigo-400 rounded-full"></span> {item.lesson}
                                                                            </p>
                                                                        </div>
                                                                        <button 
                                                                            onClick={() => deleteItem(item.id)} 
                                                                            className="text-gray-300 hover:text-red-500 hover:bg-red-50 p-2 rounded-xl transition-all opacity-100 sm:opacity-0 group-hover:opacity-100 self-end sm:self-center"
                                                                            title="حذف"
                                                                        >
                                                                            <Icons.Trash2 className="w-5 h-5" />
                                                                        </button>
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
